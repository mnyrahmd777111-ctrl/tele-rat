name: build-client

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Inject token
        shell: bash
        run: |
          python -c "import os; s=open('client.py',encoding='utf-8').read(); s=s.replace('PUT_TOKEN',os.environ['BOT_TOKEN']); s=s.replace('PUT_ID',os.environ['ADMIN_ID']); open('client_build.py','w',encoding='utf-8').write(s)"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --noconsole --name syscache client_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: syscache-exe
          path: dist/syscache.exe
          retention-days: 7
